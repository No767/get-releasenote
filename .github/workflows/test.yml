name: Tests

on:
  push:
    branches: [main]
      
  pull_request:
    branches: [main]
      
  
jobs: 
  Test:
    name: Test
    runs-on: ubuntu-24.04

    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Install dependencies
        run: | 
          uv sync --frozen

      - name: Run Tests
        run: uv run pytest

      - name: Minimize uv cache
        run: |
          uv cache prune --ci